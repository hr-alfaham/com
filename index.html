<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حيدر الفحام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --bg: #fbfcfd;
  --bg-grad-1: rgba(30,58,95,0.06);
  --bg-grad-2: rgba(201,169,98,0.07);
  --text: #1a2332;
  --text-soft: #2a3547;
  --text-muted: #6e7f98;
  --text-faint: #98a5b8;
  --surface: #ffffff;
  --surface-2: #fbfcfd;
  --surface-3: #f8fafc;
  --border: rgba(30,58,95,0.08);
  --border-soft: rgba(30,58,95,0.1);
  --border-focus: rgba(201,169,98,0.55);
  --accent: #0d1b2a;
  --accent-2: #1e3a5f;
  --gold: #c9a962;
  --gold-light: #e8cc8a;
  --gold-glow: rgba(201,169,98,0.5);
  --gold-bg: rgba(201,169,98,0.1);
  --gold-bg-h: rgba(201,169,98,0.15);
  --gold-border: rgba(201,169,98,0.25);
  --gold-border-h: rgba(201,169,98,0.45);
  --shadow-sm: 0 2px 10px rgba(13,27,42,0.05);
  --shadow-md: 0 6px 26px rgba(13,27,42,0.08);
  --shadow-lg: 0 10px 44px rgba(13,27,42,0.08);
  --shadow-card: 0 22px 52px rgba(13,27,42,0.18);
  --shadow-btn: 0 4px 18px rgba(13,27,42,0.14);
  --shadow-btn-h: 0 8px 28px rgba(13,27,42,0.24);
  --scroll-track: #f0f2f5;
  --input-bg: #fbfcfd;
  --input-focus-bg: #ffffff;
  --over-grad: linear-gradient(to top, rgba(13,27,42,0.72) 0%, rgba(13,27,42,0.28) 38%, rgba(13,27,42,0.06) 68%, transparent 100%);
  --header-bg: #e8eef5;
  --theme-icon: "\f185";
  --theme-icon-color: #ffffff;
  --btn-text: #ffffff;
}
[data-theme="dark"] {
  --bg: #171717;
  --bg-grad-1: rgba(217,154,58,0.12);
  --bg-grad-2: rgba(255,255,255,0.03);
  --text: #f5f1e8;
  --text-soft: #ded8cd;
  --text-muted: #aaa39a;
  --text-faint: #807a72;
  --surface: #242424;
  --surface-2: #1f1f1f;
  --surface-3: #2c2c2c;
  --border: rgba(255,255,255,0.1);
  --border-soft: rgba(255,255,255,0.14);
  --border-focus: rgba(217,154,58,0.65);
  --accent: #f5f1e8;
  --accent-2: #d8c7a5;
  --gold: #d99a3a;
  --gold-light: #efbd69;
  --gold-glow: rgba(217,154,58,0.45);
  --gold-bg: rgba(217,154,58,0.12);
  --gold-bg-h: rgba(217,154,58,0.18);
  --gold-border: rgba(217,154,58,0.3);
  --gold-border-h: rgba(217,154,58,0.6);
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.28);
  --shadow-md: 0 6px 28px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 48px rgba(0,0,0,0.45);
  --shadow-card: 0 22px 56px rgba(0,0,0,0.58);
  --shadow-btn: 0 4px 18px rgba(0,0,0,0.3);
  --shadow-btn-h: 0 8px 30px rgba(0,0,0,0.45);
  --scroll-track: #101010;
  --input-bg: #202020;
  --input-focus-bg: #242424;
  --over-grad: linear-gradient(to top, rgba(23,23,23,0.78) 0%, rgba(36,36,36,0.38) 38%, rgba(23,23,23,0.1) 68%, transparent 100%);
  --header-bg: #242424;
  --theme-icon: "\f186";
  --theme-icon-color: #ffffff;
  --btn-text: #f5f9ff;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal',sans-serif; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 0%, var(--bg-grad-1) 0%, transparent 50%),
    radial-gradient(circle at 85% 100%, var(--bg-grad-2) 0%, transparent 45%);
  background-attachment:fixed;
  transition: background 0.4s ease, color 0.3s ease;
}
::-webkit-scrollbar { width:10px; }
::-webkit-scrollbar-track { background: var(--scroll-track); transition: background 0.3s; }
::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#1e3a5f,#0d1b2a); border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:linear-gradient(180deg,#2a4a7a,#1a2d47); }

.site-logo {
  position:absolute; top:24px; right:24px; z-index:20;
  width:46px; height:46px; border-radius:14px; overflow:hidden;
  background: var(--surface);
  border:1px solid var(--border-soft);
  box-shadow: var(--shadow-sm);
  transition:0.35s;
}
.site-logo a { display:block; width:100%; height:100%; }
.site-logo img { width:100%; height:100%; object-fit:cover; display:block; }
.site-logo:hover {
  transform:scale(1.08) rotate(-3deg);
  border-color: var(--gold-border-h);
  box-shadow: 0 8px 28px var(--gold-bg);
}

.theme-toggle {
  position:absolute; top:24px; left:24px; z-index:20;
  width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  background: transparent;
  border:none;
  color: var(--theme-icon-color);
  font-size:22px;
  box-shadow: none;
  transition: all 0.35s ease;
  padding:0;
}
.theme-toggle:hover {
  transform: rotate(25deg) scale(1.15);
  color: var(--gold);
}
.theme-toggle::before {
  content:var(--theme-icon);
  font-family:"Font Awesome 6 Free";
  font-weight:900;
}

.back-float {
  position:absolute; top:86px; left:24px; z-index:19;
  display:none; align-items:center; gap:8px;
  padding:10px 18px;
  background: var(--surface);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border-soft);
  color: var(--text); border-radius:50px; cursor:pointer;
  font-size:14px; font-weight:700; text-decoration:none;
  box-shadow: var(--shadow-sm);
  transition:0.3s;
}
.back-float:hover {
  transform:translateX(3px);
  border-color: var(--gold-border-h);
  box-shadow: 0 10px 32px var(--gold-bg);
  color: var(--accent);
}
.back-float.show { display:flex; }

.header {
  width:100%; height:320px; position:relative; overflow:hidden;
}
.header-bg {
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  transform:scale(1.05); transition:transform 0.8s;
  background-color: var(--header-bg);
}
.header:hover .header-bg { transform:scale(1.1); }
.header::after {
  content:''; position:absolute; inset:0;
  background: var(--over-grad);
  z-index:1;
}
.header-content {
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 28px 42px; max-width:1150px; margin:0 auto; width:100%;
}
.header h1 {
  color:#ffffff; font-size:28px; font-weight:800;
  text-shadow:0 4px 24px rgba(0,0,0,0.55); line-height:1.3;
}
.header-title-bar {
  width:70px; height:4px; margin-top:16px; border-radius:4px;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  box-shadow:0 0 18px var(--gold-glow);
}

.sites-section {
  display:block; border-bottom:1px solid #d9dde3;
  background:#ffffff;
}
.sites-inner {
  max-width:1150px; margin:0 auto; padding:8px 24px;
  display:flex; align-items:center; gap:22px;
}
.sites-title {
  flex:0 0 auto; color:var(--accent); font-size:14px; font-weight:800;
  padding-inline-end:22px; border-inline-end:1px solid var(--border);
}
.sites-list {
  display:flex; align-items:center; gap:10px; min-width:0;
  overflow-x:auto; scrollbar-width:none;
}
.sites-list::-webkit-scrollbar { display:none; }
.site-link {
  flex:0 0 auto; color:#0d1b2a; text-decoration:none;
  font-size:13px; font-weight:800; letter-spacing:0.15px; padding:2px 10px;
  transition:0.25s;
}
.site-link:hover {
  color:#d99a3a; opacity:1;
}
.ticker-section {
  display:none; overflow:hidden; background:#d99a3a; color:#0d1b2a;
  border-bottom:1px solid #b87822;
}
.ticker-section.show { display:block; }
.ticker-track {
  display:flex; width:max-content; min-width:100%;
  animation:ticker-scroll 240s linear infinite;
}
.ticker-section:hover .ticker-track,
.ticker-section:focus-within .ticker-track { animation-play-state:paused; }
.ticker-group {
  display:flex; align-items:center; flex:0 0 auto;
}
.ticker-item {
  display:inline-flex; align-items:center; gap:22px;
  padding:7px 22px; color:#0d1b2a; text-decoration:none;
  font-size:13px; font-weight:800; letter-spacing:0.15px; white-space:nowrap;
}
.ticker-item::after { content:'•'; color:#fff8df; font-size:18px; }
.ticker-item:hover { color:#ffffff; }
@keyframes ticker-scroll {
  from { transform:translateX(0); }
  to { transform:translateX(50%); }
}

.container { max-width:1150px; margin:0 auto; padding:42px 24px 72px; }
.section-label {
  display:inline-flex; align-items:center; gap:10px;
  font-size:14px; font-weight:800; color: var(--accent);
  margin-bottom:22px; padding:8px 18px;
  background: var(--gold-bg);
  border:1px solid var(--gold-border);
  border-radius:50px;
}
.section-label::before {
  content:''; width:6px; height:6px; border-radius:50%;
  background: var(--gold);
  box-shadow:0 0 10px var(--gold-glow);
}

.cards { display:grid; grid-template-columns:repeat(2,1fr); gap:26px 18px; }
.post-cards { margin-top:26px; }
.card { cursor:pointer; transition:transform 0.4s cubic-bezier(0.2,0.8,0.2,1); }
.card:hover { transform:translateY(-7px); }
.card-img-wrap {
  border-radius:18px; overflow:hidden; position:relative;
  border:1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-md), 0 1px 0 rgba(255,255,255,0.9) inset;
  transition:0.4s;
}
.card:hover .card-img-wrap {
  border-color: var(--gold-border-h);
  box-shadow: var(--shadow-card), 0 0 0 1px var(--gold-bg), 0 2px 0 rgba(255,255,255,1) inset;
}
.card-img-wrap::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top, rgba(13,27,42,0.82) 0%, rgba(13,27,42,0.25) 50%, transparent 72%);
  opacity:0.92; transition:0.4s; pointer-events:none;
}
.card:hover .card-img-wrap::after {
  opacity:1;
  background:linear-gradient(to top, rgba(13,27,42,0.92) 0%, rgba(13,27,42,0.4) 55%, transparent 78%);
}
.card-img {
  width:100%; aspect-ratio:16/10; object-fit:cover; display:block;
  transition:transform 0.6s cubic-bezier(0.2,0.8,0.2,1);
  background: #eef0f3;
}
.card:hover .card-img { transform:scale(1.09); }
.card-overlay {
  position:absolute; bottom:0; inset-inline:0; z-index:2;
  padding:22px 22px 20px;
}
.card-name {
  font-size:16px; color:#ffffff; font-weight:800; letter-spacing:0.15px; line-height:1.45;
  text-shadow:0 2px 12px rgba(0,0,0,0.65);
  position:relative; z-index:2;
}
.card-divider {
  width:0; height:3px; margin-top:12px; border-radius:3px;
  background:linear-gradient(90deg,var(--gold),transparent);
  transition:width 0.5s;
}
.card:hover .card-divider { width:100%; }

.empty {
  text-align:center; padding:70px 20px;
  color: var(--text-muted); font-size:15px; font-weight:600;
}
.loading {
  text-align:center; padding:70px;
  color: var(--text-muted);
}
.loader {
  display:inline-block; width:46px; height:46px;
  border:3px solid var(--border-soft);
  border-top-color: var(--gold);
  border-radius:50%;
  animation:spin 0.9s linear infinite;
  margin-bottom:16px;
  box-shadow:0 0 24px var(--gold-bg);
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:14px; color: var(--text-muted); letter-spacing:0.5px; font-weight:600; }

.scroll-top {
  position:fixed; bottom:30px; left:30px;
  width:46px; height:46px; border-radius:14px;
  background: var(--surface);
  color: var(--accent);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  border:1px solid var(--border-soft);
  box-shadow: var(--shadow-sm);
  opacity:0; transform:translateY(16px); transition:0.35s;
  z-index:40; font-size:18px; font-weight:800;
}
.scroll-top.show { opacity:1; transform:translateY(0); }
.scroll-top:hover {
  background:linear-gradient(135deg,#0d1b2a,#1e3a5f);
  color: var(--gold);
  border-color: var(--gold-border);
  transform:translateY(-3px);
  box-shadow: 0 12px 36px var(--gold-bg);
}

.footer {
  border-top:1px solid var(--border);
  padding:34px 24px; text-align:center;
  background: var(--surface);
}
.footer-inner { max-width:1150px; margin:0 auto; }
.footer-brand {
  font-size:16px; font-weight:800; color: var(--accent); margin-bottom:8px;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.footer-brand::before {
  content:''; width:8px; height:8px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#a07e3f);
  box-shadow:0 0 12px var(--gold-glow);
}
.footer-copy { font-size:13px; color: var(--text-muted); font-weight:600; }
.footer-copy span { color: var(--gold); font-weight:800; }
.social-links {
  display:flex; justify-content:center; align-items:center; gap:18px;
  margin-bottom:18px;
}
.social-link {
  color:var(--text-soft); font-size:19px; text-decoration:none;
  transition:0.25s;
}
.social-link:hover { color:var(--gold); transform:translateY(-2px); }

@media (max-width:600px) {
  .site-logo { top:24px; right:24px; width:42px; height:42px; }
  .theme-toggle { top:24px; left:24px; width:42px; height:42px; font-size:20px; }
  .back-float { top:86px; left:24px; padding:8px 14px; font-size:13px; }
  .header { height:250px; }
  .header h1 { font-size:19px; }
  .header-content { padding:0 20px 30px; }
  .header-title-bar { width:55px; height:3px; margin-top:12px; }
  .sites-inner { padding:6px 16px; gap:14px; }
  .sites-title { padding-inline-end:14px; font-size:13px; }
  .site-link { font-size:12px; padding:1px 8px; }
  .ticker-item { padding:6px 16px; font-size:12px; }
  .container { padding:28px 16px 56px; }
  .cards { grid-template-columns:1fr 1fr; gap:16px 12px; }
  .card-name { font-size:13px; line-height:1.4; }
  .card-overlay { padding:16px 14px 14px; }
  .card-divider { height:2px; margin-top:8px; }
  .scroll-top { width:42px; height:42px; bottom:24px; left:24px; font-size:16px; border-radius:12px; }
}
</style>

<body>

<div class="header" id="main-header">
  <div class="header-bg" id="header-bg"></div>

  <div class="site-logo" title="حيدر الفحام">
    <a href="index.html"><img src="https://e.top4top.io/p_3916uvvbp1.jpg" alt="حيدر الفحام"></a>
  </div>

  <button class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع"></button>

  <div class="header-content">
    <h1 id="main-title">حيدر الفحام</h1>
    <div class="header-title-bar"></div>
  </div>
</div>

<section class="sites-section" id="sites-section" aria-label="قسم المواقع">
  <div class="sites-inner">
    <nav class="sites-list" id="sites-list"></nav>
  </div>
</section>

<section class="ticker-section" id="ticker-section" aria-label="آخر المنشورات">
  <div class="ticker-track" id="ticker-track"></div>
</section>

<div class="container" id="content">
  <div class="loading">
    <div class="loader"></div>
    <div class="loading-text">جاري التحميل...</div>
  </div>
</div>

<div class="scroll-top" id="scroll-top" title="الرجوع للأعلى">↑</div>

<div class="footer">
  <div class="footer-inner">
    <div class="social-links" id="social-links" aria-label="التواصل الاجتماعي"></div>
    <div class="footer-copy">© جميع الحقوق محفوظة <span id="year"></span></div>
  </div>
</div>

<script>
(function() {
  const saved = localStorage.getItem('hf-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAC4NGe5WZG28-GxB6ACwVKdwjOEAvw3Ck",
  authDomain: "haideralfaham.firebaseapp.com",
  databaseURL: "https://haideralfaham-default-rtdb.firebaseio.com",
  projectId: "haideralfaham",
  storageBucket: "haideralfaham.firebasestorage.app",
  messagingSenderId: "334107226981",
  appId: "1:334107226981:web:6d91bb915cbdd5e736278c",
  measurementId: "G-1FSSP932J4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_MAIN_HEADER_IMG = "https://c.top4top.io/p_3916wtc7t0.png";
let mainHeaderImg = DEFAULT_MAIN_HEADER_IMG;

const params = new URLSearchParams(location.search);
const currentSectionId = params.get('section') || '';

if (currentSectionId) {
  document.getElementById('header-bg').style.backgroundImage = 'none';
}

let sectionsCache = {};
let postsCache = {};
let sitesCache = {};
let socialsCache = {};

document.getElementById('year').textContent = new Date().getFullYear();

const toggleBtn = document.getElementById('theme-toggle');
const themeMeta = document.getElementById('theme-color');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('hf-theme', t);
  themeMeta.setAttribute('content', t === 'dark' ? '#050a14' : '#fbfcfd');
  toggleBtn.title = t === 'dark' ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن';
  toggleBtn.setAttribute('aria-label', toggleBtn.title);
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
toggleBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

const scrollTopBtn = document.getElementById('scroll-top');
window.addEventListener('scroll', () => {
  if (window.scrollY > 400) scrollTopBtn.classList.add('show');
  else scrollTopBtn.classList.remove('show');
});
scrollTopBtn.onclick = () => window.scrollTo({ top:0, behavior:'smooth' });

onValue(ref(db, 'sections'), snap => {
  sectionsCache = snap.val() || {};
  render();
});
onValue(ref(db, 'posts'), snap => {
  postsCache = snap.val() || {};
  renderTicker();
  render();
});
onValue(ref(db, 'siteSettings'), snap => {
  mainHeaderImg = safeUrl(snap.val()?.header) || DEFAULT_MAIN_HEADER_IMG;
  render();
});
onValue(ref(db, 'socialLinks'), snap => {
  socialsCache = snap.val() || {};
  renderSocials();
});
onValue(ref(db, 'sites'), snap => {
  sitesCache = snap.val() || {};
  renderSites();
});

function renderSites() {
  const section = document.getElementById('sites-section');
  const list = document.getElementById('sites-list');
  const sites = Object.values(sitesCache).filter(site => site && site.name && siteUrl(site.url));
  section.classList.add('show');
  list.innerHTML = `
    <a class="site-link" href="index.html">الرئيسية</a>
  ` + sites.map(site => `
    <a class="site-link" href="${escapeHtml(siteUrl(site.url))}">
      ${escapeHtml(site.name)}
    </a>
  `).join('');
}

function renderSocials() {
  const list = document.getElementById('social-links');
  const icons = {
    facebook: ['fa-brands fa-facebook-f', 'فيسبوك'],
    instagram: ['fa-brands fa-instagram', 'إنستغرام'],
    youtube: ['fa-brands fa-youtube', 'يوتيوب'],
    tiktok: ['fa-brands fa-tiktok', 'تيك توك'],
    telegram: ['fa-brands fa-telegram', 'تلغرام'],
    whatsapp: ['fa-brands fa-whatsapp', 'واتساب'],
    x: ['fa-brands fa-x-twitter', 'إكس'],
    linkedin: ['fa-brands fa-linkedin-in', 'لينكدإن'],
    link: ['fa-solid fa-link', 'رابط']
  };
  list.innerHTML = Object.values(socialsCache).filter(item => item && icons[item.icon || item.platform] && socialUrl(item.url)).map(item => {
    const icon = icons[item.icon || item.platform];
    const label = item.name || icon[1];
    return `
    <a class="social-link" href="${escapeHtml(socialUrl(item.url))}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" onclick="window.open(this.href, '_blank', 'noopener,noreferrer'); return false;" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">
      <i class="${icon[0]}" aria-hidden="true"></i>
    </a>
  `;
  }).join('');
}

function renderTicker() {
  const section = document.getElementById('ticker-section');
  const track = document.getElementById('ticker-track');
  const posts = Object.entries(postsCache)
    .filter(([, post]) => post && post.title)
    .sort(([firstId, first], [secondId, second]) => postTimestamp(secondId, second) - postTimestamp(firstId, first));

  section.classList.toggle('show', posts.length > 0);
  if (!posts.length) {
    track.innerHTML = '';
    return;
  }

  const items = posts.map(([id, post]) => `
    <a class="ticker-item" href="post.html?id=${encodeURIComponent(id)}">${escapeHtml(post.title)}</a>
  `).join('');
  track.innerHTML = `<div class="ticker-group">${items}</div><div class="ticker-group" aria-hidden="true">${items}</div>`;
}

function postTimestamp(id, post) {
  if (Number(post.createdAt)) return Number(post.createdAt);
  const chars = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
  let timestamp = 0;
  for (const char of String(id).slice(0, 8)) timestamp = timestamp * 64 + chars.indexOf(char);
  return timestamp;
}

function render() {
  const content = document.getElementById('content');
  const headerBg = document.getElementById('header-bg');
  const title = document.getElementById('main-title');

  if (currentSectionId) {
    const sec = sectionsCache[currentSectionId];
    if (!sec) { content.innerHTML = '<div class="empty">القسم غير موجود</div>'; return; }

    if (safeUrl(sec.header)) headerBg.style.backgroundImage = `url('${safeUrl(sec.header)}')`;
    else if (safeUrl(sec.image)) headerBg.style.backgroundImage = `url('${safeUrl(sec.image)}')`;
    else headerBg.style.backgroundImage = `url('${mainHeaderImg}')`;
    title.textContent = sec.name;

    const subs = Object.entries(sectionsCache).filter(([id, s]) => s.parent === currentSectionId);
    const posts = Object.entries(postsCache)
      .filter(([id, p]) => p.sectionId === currentSectionId)
      .sort(([firstId, first], [secondId, second]) => postTimestamp(secondId, second) - postTimestamp(firstId, first));

    let html = '';

    if (subs.length) {
      html += `<div class="cards sub-section-cards">`;
      subs.forEach(([id, s]) => { html += cardSection(id, s); });
      html += `</div>`;
    }

    if (posts.length) {
      html += `<div class="cards post-cards">`;
      posts.forEach(([id, p]) => { html += cardPost(id, p); });
      html += `</div>`;
    }

    if (!subs.length && !posts.length) {
      html = '<div class="empty">لا يوجد محتوى في هذا القسم بعد</div>';
    }

    content.innerHTML = html;
    bindCards();
    return;
  }

  headerBg.style.backgroundImage = `url('${mainHeaderImg}')`;
  title.textContent = 'حيدر الفحام';

  const mains = Object.entries(sectionsCache).filter(([id, s]) => !s.parent);

  if (!mains.length) {
    content.innerHTML = '<div class="empty">لا توجد أقسام بعد</div>';
    return;
  }

  let html = `<div class="cards">`;
  mains.forEach(([id, s]) => { html += cardSection(id, s); });
  html += `</div>`;
  content.innerHTML = html;
  bindCards();
}

function cardSection(id, s) {
  const img = safeUrl(s.image) || 'https://placehold.co/640x400/eef0f3/6e7f98/png?text=+';
  return `
    <div class="card" data-link="${escapeHtml(s.link && safeUrl(s.link) || `?section=${encodeURIComponent(id)}`)}">
      <div class="card-img-wrap">
        <img class="card-img" src="${escapeHtml(img)}" loading="lazy" alt="${escapeHtml(s.name)}">
        <div class="card-overlay">
          <div class="card-name">${escapeHtml(s.name)}</div>
          <div class="card-divider"></div>
        </div>
      </div>
    </div>
  `;
}

function cardPost(id, p) {
  let img = p.image;

  if (!img && p.content) {
    const imgMatch = p.content.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (imgMatch) img = imgMatch[1];
  }

  if (!img && p.videos && p.videos.length) {
    for (const v of p.videos) {
      const ytId = extractYT(v);
      if (ytId) { img = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`; break; }
    }
  }

  if (!img && p.shortVideos && p.shortVideos.length) {
    for (const v of p.shortVideos) {
      const ytId = extractYT(v);
      if (ytId) { img = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`; break; }
    }
  }

  if (!img && p.content) {
    const iframeMatch = p.content.match(/youtube\.com\/embed\/([\w-]{11})/i);
    if (iframeMatch) img = `https://img.youtube.com/vi/${iframeMatch[1]}/hqdefault.jpg`;
  }

  img = safeUrl(img) || 'https://placehold.co/640x400/eef0f3/6e7f98/png?text=+';

  return `
    <div class="card" data-link="post.html?id=${encodeURIComponent(id)}">
      <div class="card-img-wrap">
        <img class="card-img" src="${escapeHtml(img)}" loading="lazy" alt="${escapeHtml(p.title)}">
        <div class="card-overlay">
          <div class="card-name">${escapeHtml(p.title)}</div>
          <div class="card-divider"></div>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function safeUrl(value) {
  try {
    const url = new URL(String(value || ''), location.href);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
  } catch {
    return '';
  }
}

function siteUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  if (/^(mailto:|tel:)/i.test(raw)) return raw;
  if (/^\/[/]?/.test(raw) || raw.startsWith('#')) return raw;
  return safeUrl(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
}

function socialUrl(value) {
  const raw = String(value || '').trim();
  return safeUrl(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
}

function bindCards() {
  document.querySelectorAll('.card').forEach(c => {
    c.onclick = () => location.href = c.dataset.link;
  });
}

function extractYT(url) {
  if (!url) return null;
  url = url.trim();
  const patterns = [
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/watch\?[^ ]*v=)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/,
    /(?:youtube\.com\/shorts\/)([\w-]{11})/,
    /(?:youtube\.com\/live\/)([\w-]{11})/,
    /(?:youtube\.com\/v\/)([\w-]{11})/,
    /(?:youtube\.com\/.*[?&]v=)([\w-]{11})/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  if (/^[\w-]{11}$/.test(url)) return url;
  return null;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
